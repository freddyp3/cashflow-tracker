services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cashflow_tracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/database/create_tables.sql:/docker-entrypoint-initdb.d/01-tables.sql:ro
      - ./app/database/create_views.sql:/docker-entrypoint-initdb.d/02-views.sql:ro
      - ./app/database/migrations/002_external_ref.sql:/docker-entrypoint-initdb.d/03-migration-002.sql:ro
      - ./app/database/migrations/003_coordinates_platforms.sql:/docker-entrypoint-initdb.d/04-migration-003.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cashflow_tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cashflow_tracker_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      app:
        condition: service_healthy

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=cashflow-local
    ports:
      - "8085:8085"

  worker:
    build: ./worker
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: cashflow-local
      TRACKER_API_URL: ${TRACKER_API_URL:-http://app:8080}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    volumes:
      - ${GMAIL_CREDENTIALS_DIR:-./worker/credentials}:/secrets:ro
      - workerstate:/state
    ports:
      - "8090:8090"
    depends_on:
      pubsub-emulator:
        condition: service_started
      app:
        condition: service_healthy

  worker-test:
    profiles: ["test"]
    image: golang:1.23-alpine
    working_dir: /src
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      PUBSUB_PROJECT_ID: cashflow-local
      GOFLAGS: -mod=mod
      CGO_ENABLED: "0"
    volumes:
      - ./worker:/src
      - gomodcache:/go/pkg/mod
    command: sh -c "go vet ./... && go test ./..."
    depends_on:
      - pubsub-emulator

volumes:
  pgdata:
  gomodcache:
  workerstate:
