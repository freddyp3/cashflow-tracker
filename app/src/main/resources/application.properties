spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cashflow_tracker_db}
spring.datasource.username=${DB_USER:fredrikpettit}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
geocoding.base-url=${GEOCODING_URL:https://nominatim.openstreetmap.org}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
cache.stats.enabled=${STATS_CACHE_ENABLED:true}
cache.stats.ttl=${STATS_CACHE_TTL:10m}
