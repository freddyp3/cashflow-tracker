# Production override: run the worker against real Gmail + Google Cloud
# Pub/Sub instead of the emulator. Apply with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build worker
# See worker/README.md for the GCP/OAuth setup.
services:
  worker:
    environment: !override
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:?set PUBSUB_PROJECT_ID in .env}
      PUBSUB_TOPIC: ${PUBSUB_TOPIC:-gmail-notifications}
      PUBSUB_SUBSCRIPTION: ${PUBSUB_SUBSCRIPTION:-gmail-notifications-worker}
      PUBSUB_DLQ_TOPIC: ${PUBSUB_DLQ_TOPIC:-gmail-notifications-dlq}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-service-account.json
      GMAIL_TOKEN_FILE: /secrets/gmail_token.json
      TRACKER_API_URL: ${TRACKER_API_URL:-http://app:8080}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
    depends_on: !override
      app:
        condition: service_healthy
    restart: unless-stopped
